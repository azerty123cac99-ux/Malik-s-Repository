<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ethical Dilemmas: Cases 5–8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===========================================
   VIEWPORT FITTING: MANDATORY BASE STYLES
   =========================================== */
html, body { height: 100%; overflow-x: hidden; }
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
.slide {
  width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
  scroll-snap-align: start; display: flex; flex-direction: column; position: relative;
}
.slide-content {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  max-height: 100%; overflow: hidden; padding: var(--slide-padding);
}
:root {
  --title-size: clamp(1.5rem, 5vw, 4rem);
  --h2-size: clamp(1.25rem, 3.5vw, 2.5rem);
  --h3-size: clamp(1rem, 2.5vw, 1.75rem);
  --body-size: clamp(0.75rem, 1.5vw, 1.125rem);
  --small-size: clamp(0.65rem, 1vw, 0.875rem);
  --slide-padding: clamp(1rem, 4vw, 4rem);
  --content-gap: clamp(0.5rem, 2vw, 2rem);
  --element-gap: clamp(0.25rem, 1vw, 1rem);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
  gap: clamp(0.5rem, 1.5vw, 1rem);
}
@media (max-height: 700px) {
  :root {
    --slide-padding: clamp(0.75rem, 3vw, 2rem);
    --content-gap: clamp(0.4rem, 1.5vw, 1rem);
    --title-size: clamp(1.25rem, 4.5vw, 2.5rem);
    --h2-size: clamp(1rem, 3vw, 1.75rem);
  }
}
@media (max-height: 600px) {
  :root {
    --slide-padding: clamp(0.5rem, 2.5vw, 1.5rem);
    --content-gap: clamp(0.3rem, 1vw, 0.75rem);
    --title-size: clamp(1.1rem, 4vw, 2rem);
    --body-size: clamp(0.7rem, 1.2vw, 0.95rem);
  }
  .nav-dots, .keyboard-hint, .decorative { display: none; }
}
@media (max-height: 500px) {
  :root {
    --slide-padding: clamp(0.4rem, 2vw, 1rem);
    --title-size: clamp(1rem, 3.5vw, 1.5rem);
    --h2-size: clamp(0.9rem, 2.5vw, 1.25rem);
    --body-size: clamp(0.65rem, 1vw, 0.85rem);
  }
}
@media (max-width: 600px) {
  :root { --title-size: clamp(1.25rem, 7vw, 2.5rem); }
  .grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
  html { scroll-behavior: auto; }
}

/* ===========================================
   THEME: BOLD SIGNAL
   Change these tokens to re-skin the deck.
   =========================================== */
:root {
  --bg: #1c1c1e;
  --bg-2: #262628;
  --ink: #f5f3ef;
  --muted: #a6a39c;
  --accent: #ff5a1f;      /* hot orange focal colour */
  --accent-ink: #1c1c1e;
  --line: #3a3a3d;
  --font-display: "Archivo Black", "Arial Black", sans-serif;
  --font-body: "Space Grotesk", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); }
.slide { background: var(--bg); }
.slide:nth-child(even) { background: var(--bg-2); }

/* Oversized background case number: the deck's signature */
.bignum {
  position: absolute; right: calc(-1 * clamp(0.5rem, 2vw, 2rem)); bottom: calc(-1 * clamp(2rem, 6vw, 5rem));
  font-family: var(--font-display); font-size: clamp(10rem, 38vw, 34rem); line-height: 1;
  color: var(--ink); opacity: 0.045; pointer-events: none; user-select: none;
}
.kicker {
  font-size: var(--small-size); font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--accent); margin-bottom: var(--element-gap);
}
h1 { font-family: var(--font-display); font-size: var(--title-size); line-height: 1.02; letter-spacing: -0.01em; }
h2 { font-family: var(--font-display); font-size: var(--h2-size); line-height: 1.08; margin-bottom: var(--content-gap); max-width: 22ch; }
h3 { font-size: var(--h3-size); font-weight: 700; line-height: 1.15; }
p, li { font-size: var(--body-size); line-height: 1.45; }
.sub { font-size: var(--h3-size); color: var(--muted); margin-top: var(--content-gap); max-width: 40ch; }
.wrap { max-width: 1200px; width: 100%; margin: 0 auto; position: relative; z-index: 1; }

.bullets { list-style: none; display: flex; flex-direction: column; gap: clamp(0.4rem, 1.4vh, 1rem); max-width: 62ch; }
.bullets li { padding-left: 1.4em; position: relative; }
.bullets li::before { content: ""; position: absolute; left: 0; top: 0.55em; width: 0.55em; height: 0.55em; background: var(--accent); }

/* Two-column: text + focal card */
.split { display: grid; grid-template-columns: 1.4fr 1fr; gap: var(--content-gap); align-items: center; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }

.focal {
  background: var(--accent); color: var(--accent-ink);
  padding: clamp(0.9rem, 2.5vw, 2rem); display: flex; flex-direction: column; gap: var(--element-gap);
}
.focal .label { font-size: var(--small-size); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.focal .type { font-family: var(--font-display); font-size: var(--h2-size); line-height: 1.05; }
.focal p { font-size: var(--small-size); line-height: 1.45; }

.card {
  background: rgba(255,255,255,0.04); border: 1px solid var(--line);
  padding: clamp(0.6rem, 1.6vw, 1.25rem); display: flex; flex-direction: column; gap: 0.3em;
}
.card h3 { font-size: clamp(0.85rem, 1.6vw, 1.2rem); }
.card p { color: var(--muted); font-size: var(--small-size); }
.card .n { font-family: var(--font-display); color: var(--accent); font-size: var(--h3-size); line-height: 1; }
.grid.six { grid-template-columns: repeat(3, 1fr); }
.grid.three { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 760px) { .grid.six { grid-template-columns: repeat(2, 1fr); } .grid.three { grid-template-columns: 1fr; } }

.best {
  margin-top: var(--content-gap); background: var(--accent); color: var(--accent-ink);
  padding: clamp(0.7rem, 1.8vw, 1.4rem) clamp(0.9rem, 2.2vw, 1.8rem);
}
.best .label { font-size: var(--small-size); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.3em; }
.best p { font-size: var(--body-size); font-weight: 500; }

.impact-row { display: grid; grid-template-columns: auto 1fr; gap: 0.2em clamp(0.8rem, 2vw, 1.6rem); align-items: baseline;
  padding: clamp(0.5rem, 1.6vh, 1rem) 0; border-top: 1px solid var(--line); }
.impact-row:last-child { border-bottom: 1px solid var(--line); }
.impact-row .tag { font-family: var(--font-display); font-size: var(--h3-size); color: var(--accent); min-width: 6.5ch; }

.types { grid-template-columns: repeat(2, 1fr); }
.types .card .case { margin-top: auto; padding-top: 0.4em; font-size: var(--small-size); color: var(--accent); font-weight: 700; }
@media (max-width: 600px) { .types { grid-template-columns: 1fr; } }

.sources li { font-size: var(--small-size); color: var(--muted); }
.sources li strong { color: var(--ink); }

/* Reveal animation */
.reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.6s ease, transform 0.6s cubic-bezier(.2,.7,.2,1); }
.slide.visible .reveal { opacity: 1; transform: none; }
.slide.visible .reveal:nth-child(2) { transition-delay: 0.08s; }
.slide.visible .reveal:nth-child(3) { transition-delay: 0.16s; }
.slide.visible .reveal:nth-child(4) { transition-delay: 0.24s; }
.slide.visible .reveal:nth-child(5) { transition-delay: 0.32s; }
.slide.visible .reveal:nth-child(6) { transition-delay: 0.40s; }

/* Chrome: progress bar + counter + dots */
.progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 10; transition: width 0.3s ease; }
.counter { position: fixed; bottom: clamp(0.5rem, 2vh, 1.2rem); left: clamp(0.75rem, 2vw, 1.5rem); z-index: 10;
  font-size: var(--small-size); color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-dots { position: fixed; right: clamp(0.5rem, 1.5vw, 1.2rem); top: 50%; transform: translateY(-50%); z-index: 10;
  display: flex; flex-direction: column; gap: 6px; }
.nav-dots button { width: 7px; height: 7px; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.nav-dots button[aria-current="true"] { background: var(--accent); }
.nav-dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.keyboard-hint { position: fixed; bottom: clamp(0.5rem, 2vh, 1.2rem); right: clamp(0.75rem, 2vw, 1.5rem); z-index: 10;
  font-size: var(--small-size); color: var(--muted); }
@media (max-width: 600px) { .keyboard-hint, .nav-dots { display: none; } }

/* Short screens (landscape phones): tighten the densest slides */
@media (max-height: 500px) {
  h2 { margin-bottom: 0.4rem; }
  .card { padding: 0.45rem 0.6rem; gap: 0.15em; }
  .best { margin-top: 0.5rem; padding: 0.45rem 0.7rem; }
  .best p { line-height: 1.35; }
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<main id="deck" aria-label="Ethical Dilemmas presentation"></main>
<nav class="nav-dots" aria-label="Slide navigation"></nav>
<div class="counter" aria-live="polite"></div>
<div class="keyboard-hint">← → or scroll</div>

<script>
/* ===========================================
   CONTENT: edit case data here
   =========================================== */
const CASES = [
  { n: 5, co: "Amazon", title: "Warehouse Workers & Safety Reporting", year: "2023",
    summary: [
      "Workers and labor advocates raised concerns about injuries, fast production quotas, and work pace.",
      "OSHA cited several Amazon warehouses (2022–23) for ergonomic hazards; a 2024 Senate HELP Committee report criticized injury rates. Amazon disputes these findings.",
      "Workers faced a choice: report hazards, or stay silent to protect hours, evaluations, and jobs."
    ],
    type: "Nonrole",
    typeWhy: "The conflict comes from personal circumstances, not a job duty: an individual weighing coworker safety against their own income. Frameworks: rights-based (right to a safe workplace) and utilitarian (fewer injuries overall).",
    stake: [["Warehouse workers","Injury risk, job security"],["Coworkers & supervisors","Peer pressure, quota targets"],["Amazon management","Productivity vs. safety"],["Customers","Expect fast delivery"],["Shareholders","Costs and reputation"],["OSHA / regulators","Enforce safety law"]],
    impact: [["Legal","OSHA citations, fines, workers' comp costs, and turnover that raises training costs."],["Brand","Media and Senate scrutiny hurt hiring and customer trust."],["Operations","Injured or burned-out workers reduce output; organizing efforts grow."]],
    sols: [["Anonymous, no-retaliation reporting","Third-party hotline and written anti-retaliation policy; safety data reported to the board."],["Safety-adjusted metrics","Remove injury reports from productivity scoring; slow rates when hazards are flagged."],["Independent safety audits","External ergonomic audits with public results and correction deadlines."]],
    best: "Anonymous reporting plus safety-adjusted metrics. It removes the forced choice between safety and employment, which is the root of the dilemma, and it is fast and cheap to start."
  },
  { n: 6, co: "Wells Fargo", title: "Unauthorized Accounts Scandal", year: "2023–2024",
    summary: [
      "Employees opened accounts and enrolled customers in products without permission to hit aggressive sales targets.",
      "Regulators (CFPB, OCC, Federal Reserve, DOJ, SEC) fined the bank billions; in 2018 the Fed capped its asset growth until reforms were made.",
      "Thousands of employees were fired; customers paid fees and suffered credit damage."
    ],
    type: "Role Distortion",
    typeWhy: "The job is to serve customers with suitable products. Quotas and bonuses redefined “good service” as “accounts sold.” Frameworks: duty-based (honesty, consent) and justice ethics (customers bore the harm).",
    stake: [["Customers","Fees, credit damage, lost trust"],["Frontline employees","Pressure, firings, fear"],["Managers & executives","Set targets and culture"],["Board & shareholders","Losses, governance"],["Regulators","CFPB, OCC, Fed, DOJ"],["Ethics-line reporters","Risked retaliation"]],
    impact: [["Financial","Multi-billion-dollar penalties, customer refunds, and legal costs."],["Regulatory","Asset cap, leadership turnover, and mandated governance reforms."],["Brand","Lost customer trust and years of reputation rebuilding."]],
    sols: [["Redesign incentives","Replace quotas with satisfaction, retention, and quality metrics; claw back bonuses for misconduct."],["Verify customer consent","Digital consent for every new account; audit unusual account-opening patterns."],["Protect ethics-line reporters","Independent hotline reporting to the board with enforced anti-retaliation."]],
    best: "Redesign the incentives. The misconduct came from the reward system, so controls and hotlines alone only treat symptoms. Pair it with digital consent checks."
  },
  { n: 7, co: "Boeing", title: "Whistleblowers & Safety Concerns", year: "2024",
    summary: [
      "Employees such as John Barnett and Sam Salehpour raised concerns about manufacturing and quality control.",
      "After the January 2024 Alaska Airlines door-plug blowout, scrutiny grew. Barnett died in March 2024 (ruled a suicide) before finishing testimony in his retaliation case.",
      "Whistleblowers testified to the Senate; the FAA and Congress investigated."
    ],
    type: "Role Assertion",
    typeWhy: "Employees acted beyond their job descriptions to protect passengers, risking careers, legal costs, and well-being. Frameworks: duty-based (protect the public) and virtue ethics (courage, integrity).",
    stake: [["Whistleblowers","Retaliation, stress, legal costs"],["Passengers & crews","Physical safety"],["Boeing leadership","Reputation, liability"],["Airlines & suppliers","Groundings, delays"],["FAA & Congress","Oversight duty"],["Shareholders","Value and trust"]],
    impact: [["Regulatory","FAA production cap on the 737 MAX, audits, investigations, and hearings."],["Financial","Delivery delays, cash burn, legal exposure, and CEO turnover in 2024."],["Culture","Safety culture questioned; retaliation claims discourage future reporting."]],
    sols: [["Independent speak-up system","Confidential channel to a board safety committee with tracked responses and deadlines."],["Enforced anti-retaliation","Fast, neutral review of claims; discipline managers who retaliate; legal support for reporters."],["Safety in executive pay","Tie bonuses to quality and safety indicators, not just deliveries."]],
    best: "An independent speak-up system with enforced anti-retaliation protection. Credible internal reporting means employees needn't go to regulators or media first, and structured review screens out unsupported claims."
  },
  { n: 8, co: "Meta", title: "Employees & AI Projects", year: "2024",
    summary: [
      "Tech employees, including at Meta, voiced concerns about AI misinformation, discrimination, privacy, and misuse of generative AI.",
      "Examples: using public posts to train AI, which drew European regulator attention in 2024, and internal AI chatbot guidelines criticized in 2025.",
      "Individuals had to choose: keep working, request safeguards, raise concerns, transfer, or leave."
    ],
    type: "Nonrole",
    typeWhy: "Employees rarely make the final call; the conflict is personal conscience versus contributing to a project with both benefits and risks. Frameworks: virtue ethics (integrity) and utilitarian (benefits vs. harms).",
    stake: [["Meta employees","Conscience vs. career"],["Users & minors","Privacy, safety, misinformation"],["Meta leadership","Speed vs. safeguards"],["Shareholders","AI investment returns"],["Regulators","Privacy and AI laws"],["Society","Trust in information"]],
    impact: [["Regulatory","Privacy investigations and pressure from AI and child-safety laws."],["Talent","Unaddressed concerns lead to attrition and leaks."],["Brand","AI incidents quickly erode user and advertiser trust."]],
    sols: [["Internal AI ethics review","Cross-functional board must approve high-risk launches with documented risk assessments."],["Conscientious objection policy","Employees can transfer off objectionable projects without penalty."],["Transparent safety reporting","Publish model cards, red-team results, and known limits."]],
    best: "An internal AI ethics review with a conscientious-objection option. It gives employees a real voice inside the company, which does more than leaving, and reduces harm before launch."
  }
];

/* ===========================================
   SLIDE TEMPLATES
   =========================================== */
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const slide = (inner, num = "") =>
  `<section class="slide">${num ? `<div class="bignum decorative" aria-hidden="true">${num}</div>` : ""}<div class="slide-content"><div class="wrap">${inner}</div></div></section>`;

let html = "";

html += slide(`
  <div class="kicker reveal">Group Presentation · Cases 5–8</div>
  <h1 class="reveal">Ethical Dilemmas<br>in Modern Business</h1>
  <p class="sub reveal">Amazon · Wells Fargo · Boeing Whistleblowers · Meta</p>`);

html += slide(`
  <div class="kicker reveal">Our Lens</div>
  <h2 class="reveal">Four types of ethical dilemmas</h2>
  <div class="grid types">
    <div class="card reveal"><h3>Nonrole</h3><p>A moral conflict not created by the job; the person acts as a citizen, coworker, or individual conscience.</p><div class="case">Case 5 Amazon · Case 8 Meta</div></div>
    <div class="card reveal"><h3>Role Failure</h3><p>A clearly defined duty, such as safety, risk, or accuracy, goes unfulfilled.</p><div class="case">Not among our cases</div></div>
    <div class="card reveal"><h3>Role Distortion</h3><p>Legitimate duties are twisted by incentives, pressure, or culture.</p><div class="case">Case 6 Wells Fargo</div></div>
    <div class="card reveal"><h3>Role Assertion</h3><p>Acting on ethical duties beyond the formal job, at personal risk.</p><div class="case">Case 7 Boeing</div></div>
  </div>`);

CASES.forEach(c => {
  const k = `Case ${c.n} · ${c.co} · ${c.year}`;

  // 1 + 2: summary and type
  html += slide(`
    <div class="kicker reveal">${k}</div>
    <h2 class="reveal">${esc(c.title)}</h2>
    <div class="split">
      <ul class="bullets reveal">${c.summary.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
      <div class="focal reveal">
        <div class="label">Type of ethical issue</div>
        <div class="type">${c.type}</div>
        <p>${esc(c.typeWhy)}</p>
      </div>
    </div>`, c.n);

  // 3: stakeholders
  html += slide(`
    <div class="kicker reveal">${k}</div>
    <h2 class="reveal">Who is affected?</h2>
    <div class="grid six">${c.stake.map(s => `<div class="card reveal"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("")}</div>`, c.n);

  // 4: impact on the company
  html += slide(`
    <div class="kicker reveal">${k}</div>
    <h2 class="reveal">Impact on ${c.co}</h2>
    <div>${c.impact.map(i => `<div class="impact-row reveal"><div class="tag">${i[0]}</div><p>${esc(i[1])}</p></div>`).join("")}</div>`, c.n);

  // 5 + 6: solutions and best
  html += slide(`
    <div class="kicker reveal">${k}</div>
    <h2 class="reveal">Possible solutions</h2>
    <div class="grid three">${c.sols.map((s, i) => `<div class="card reveal"><div class="n">0${i + 1}</div><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("")}</div>
    <div class="best reveal"><div class="label">Our best solution</div><p>${esc(c.best)}</p></div>`, c.n);
});

html += slide(`
  <div class="kicker reveal">References</div>
  <h2 class="reveal">Sources</h2>
  <ul class="bullets sources reveal">
    <li><strong>Amazon:</strong> U.S. OSHA ergonomic citations (2022–23); U.S. Senate HELP Committee report on warehouse safety (2024)</li>
    <li><strong>Wells Fargo:</strong> CFPB, OCC, Federal Reserve, DOJ, and SEC enforcement actions (2016–2024)</li>
    <li><strong>Boeing:</strong> Senate Permanent Subcommittee on Investigations hearing (April 2024); FAA investigation of Alaska Airlines Flight 1282; FAA expert panel on safety culture (Feb 2024)</li>
    <li><strong>Meta:</strong> Irish Data Protection Commission and Reuters reporting on AI data use and chatbot guidelines</li>
    <li>Ongoing matters may have changed; verify current status before presenting.</li>
  </ul>`);

document.getElementById("deck").innerHTML = html;

/* ===========================================
   PRESENTATION CONTROLLER
   Keyboard, wheel, touch, dots, progress, reveal.
   =========================================== */
class Presentation {
  constructor() {
    this.slides = [...document.querySelectorAll(".slide")];
    this.index = 0;
    this.locked = false;
    this.progress = document.querySelector(".progress");
    this.counter = document.querySelector(".counter");
    this.dots = document.querySelector(".nav-dots");
    this.buildDots();
    this.observe();
    this.bind();
    this.update();
  }
  buildDots() {
    this.slides.forEach((_, i) => {
      const b = document.createElement("button");
      b.setAttribute("aria-label", `Go to slide ${i + 1}`);
      b.addEventListener("click", () => this.go(i));
      this.dots.appendChild(b);
    });
  }
  observe() {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("visible");
          if (e.intersectionRatio > 0.5) { this.index = this.slides.indexOf(e.target); this.update(); }
        }
      });
    }, { threshold: [0.2, 0.6] });
    this.slides.forEach(s => io.observe(s));
  }
  go(i) {
    this.index = Math.max(0, Math.min(this.slides.length - 1, i));
    this.slides[this.index].scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    this.update();
  }
  bind() {
    document.addEventListener("keydown", e => {
      if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); this.go(this.index + 1); }
      if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); this.go(this.index - 1); }
      if (e.key === "Home") { e.preventDefault(); this.go(0); }
      if (e.key === "End") { e.preventDefault(); this.go(this.slides.length - 1); }
    });
    window.addEventListener("wheel", e => {
      e.preventDefault();
      if (this.locked || Math.abs(e.deltaY) < 20) return;
      this.locked = true;
      this.go(this.index + (e.deltaY > 0 ? 1 : -1));
      setTimeout(() => (this.locked = false), 700);
    }, { passive: false });
    let y0 = null;
    window.addEventListener("touchstart", e => (y0 = e.touches[0].clientY), { passive: true });
    window.addEventListener("touchend", e => {
      if (y0 === null) return;
      const dy = y0 - e.changedTouches[0].clientY;
      if (Math.abs(dy) > 40) this.go(this.index + (dy > 0 ? 1 : -1));
      y0 = null;
    });
  }
  update() {
    const n = this.slides.length;
    this.progress.style.width = `${((this.index + 1) / n) * 100}%`;
    this.counter.textContent = `${this.index + 1} / ${n}`;
    [...this.dots.children].forEach((d, i) => d.setAttribute("aria-current", i === this.index));
  }
}
new Presentation();
</script>
</body>
</html>
